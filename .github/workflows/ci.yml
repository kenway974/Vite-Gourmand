name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Composer + lints + PHPUnit (PHP 8.4)
    runs-on: ubuntu-latest
    env:
      # Les commandes console utilisent la configuration de test (.env.test,
      # SQLite) : aucun service MySQL n'est nécessaire.
      APP_ENV: test

    steps:
      # Actions figées par SHA de commit : un tag peut être déplacé, pas un SHA.
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Répertoire du cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validation de composer.json
        # --no-check-publish : name/description ne sont exigés que pour un paquet publié.
        run: composer validate --strict --no-check-publish

      - name: Installation des dépendances
        id: install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit de sécurité des dépendances
        run: composer audit

      - name: Lints (conteneur, Twig, YAML, mapping Doctrine)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          php bin/console lint:container
          php bin/console lint:twig templates
          php bin/console lint:yaml config --parse-tags
          php bin/console doctrine:schema:validate --skip-sync

      - name: Tests (SQLite, .env.test)
        # Les tests tournent même si une étape précédente échoue, pour garder
        # leur résultat visible.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/phpunit
