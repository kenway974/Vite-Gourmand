name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Composer + PHPUnit (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Répertoire du cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validation de composer.json
        # --no-check-publish : name/description ne sont exigés que pour un paquet publié.
        run: composer validate --strict --no-check-publish

      - name: Installation des dépendances
        id: install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit de sécurité des dépendances
        run: composer audit

      - name: Tests (SQLite, .env.test)
        # Les tests tournent même si l'audit échoue, pour garder le résultat visible.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/phpunit
