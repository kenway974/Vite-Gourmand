services:
###> doctrine/doctrine-bundle ###
  database:
    # MySQL et non PostgreSQL : les migrations du projet sont écrites en
    # dialecte MySQL (AUTO_INCREMENT, LONGTEXT, TINYINT) et .env pointe
    # dessus. Un conteneur Postgres ici donnerait une base à laquelle
    # l'application ne sait pas parler.
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vite_gourmand}
      # You should definitely change the password in production
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
      MYSQL_USER: ${MYSQL_USER:-app}
    # utf8mb4_unicode_ci porte l'insensibilité à la casse ET aux accents
    # de la recherche du catalogue (voir MenuRepository::findCatalogue).
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-!ChangeMe!}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
