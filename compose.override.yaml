
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      # Mapping explicite : sans les deux-points, Docker publie sur un port
      # de l'hôte tiré au hasard, alors que DATABASE_URL vise 3306 en dur.
      - "3306:3306"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
